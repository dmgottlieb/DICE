[project]
name = "dice2013r"
version = "0.1.0"
description = "Python reference implementation of the DICE-2013R climate-economy model (vanilla GAMS version)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pyomo>=6.7"]

[project.optional-dependencies]
test = ["pytest>=7"]
reference = ["openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dice2013r"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["solver: tests that need the Ipopt NLP solver"]
